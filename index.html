<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی دوز تلگرام</title>
    <!-- بارگذاری کتابخانه رسمی تلگرام -->
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; direction: rtl; }
        h1 { color: #333; font-size: 20px; }
        #user-info { margin-bottom: 15px; color: #0088cc; font-weight: bold; }
        .board { display: grid; grid-template-columns: repeat(3, 80px); gap: 10px; justify-content: center; margin-top: 20px; }
        .cell { width: 80px; height: 80px; background: white; border: 2px solid #0088cc; font-size: 32px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; }
        .cell.taken { cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 18px; font-weight: bold; color: #ff3366; }
    </style>
</head>
<body>

    <h1>خوش آمدی به بازی دوز!</h1>
    <!-- نمایش نام کاربر تلگرام -->
    <div id="user-info">در حال بارگذاری...</div>
    
    <div class="board" id="board">
        <div class="cell" onclick="makeMove(this, 0)"></div>
        <div class="cell" onclick="makeMove(this, 1)"></div>
        <div class="cell" onclick="makeMove(this, 2)"></div>
        <div class="cell" onclick="makeMove(this, 3)"></div>
        <div class="cell" onclick="makeMove(this, 4)"></div>
        <div class="cell" onclick="makeMove(this, 5)"></div>
        <div class="cell" onclick="makeMove(this, 6)"></div>
        <div class="cell" onclick="makeMove(this, 7)"></div>
        <div class="cell" onclick="makeMove(this, 8)"></div>
    </div>

    <div id="status">نوبت شماست (X)</div>

    <script>
        // راه‌اندازی برنامه وب تلگرام
        const tg = window.Telegram.WebApp;
        tg.expand(); // تمام‌صفحه کردن بازی در تلگرام

        // نمایش نام کاربر تلگرام در بازی
        const userInfo = document.getElementById('user-info');
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userInfo.innerText = "بازیکن: " + tg.initDataUnsafe.user.first_name;
        } else {
            userInfo.innerText = "بازیکن: مهمان (خارج از تلگرام)";
        }

        let board = ["", "", "", "", "", "", "", "", ""];
        let gameOver = false;

        function makeMove(cell, index) {
            if (board[index] !== "" || gameOver) return;

            // حرکت کاربر (X)
            board[index] = "X";
            cell.innerText = "X";
            cell.classList.add('taken');

            if (checkWin("X")) {
                document.getElementById('status').innerText = "شما برنده شدید! 🎉";
                gameOver = true;
                return;
            }

            if (!board.includes("")) {
                document.getElementById('status').innerText = "بازی مساوی شد! 🤝";
                gameOver = true;
                return;
            }

            // حرکت ربات (O) - یک خانه خالی رندوم انتخاب می‌کند
            document.getElementById('status').innerText = "نوبت ربات...";
            setTimeout(botMove, 500);
        }

        function botMove() {
            let emptyCells = [];
            board.forEach((val, idx) => { if (val === "") emptyCells.push(idx); });

            if (emptyCells.length === 0 || gameOver) return;

            let randomIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            board[randomIndex] = "O";
            
            const cellElements = document.getElementsByClassName('cell');
            cellElements[randomIndex].innerText = "O";
            cellElements[randomIndex].classList.add('taken');

            if (checkWin("O")) {
                document.getElementById('status').innerText = "ربات برنده شد! 🤖";
                gameOver = true;
                return;
            }

            document.getElementById('status').innerText = "نوبت شماست (X)";
        }

        function checkWin(player) {
            const winPatterns = [, [3, 4, 5], [6, 7, 8], // افقی, [1, 4, 7], [2, 5, 8], // عمودی, [2, 4, 6]             // قطری
            ];
            return winPatterns.some(pattern => {
                return pattern.every(idx => board[idx] === player);
            });
        }
    </script>
</body>
</html>
