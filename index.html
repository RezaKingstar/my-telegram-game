<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سنگ کاغذ قیچی تلگرام</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; direction: rtl; }
        h1 { color: #333; font-size: 22px; }
        #user-info { margin-bottom: 20px; color: #0088cc; font-weight: bold; font-size: 16px; }
        .choices { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }
        .choice-btn { font-size: 40px; background: white; border: 3px solid #0088cc; border-radius: 15px; width: 80px; height: 80px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .choice-btn:hover { background: #e6f7ff; transform: scale(1.1); }
        .result-box { margin-top: 30px; font-size: 18px; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: inline-block; min-width: 250px; }
        #status { font-weight: bold; font-size: 20px; color: #ff3366; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>بازی سنگ، کاغذ، قیچی! ✌️✊✋</h1>
    <div id="user-info">بازیکن: مهمان</div>
    
    <div class="choices">
        <button class="choice-btn" onclick="play('سنگ')">✊</button>
        <button class="choice-btn" onclick="play('کاغذ')">✋</button>
        <button class="choice-btn" onclick="play('قیچی')">✌️</button>
    </div>

    <div class="result-box">
        <div>انتخاب شما: <span id="user-choice">-</span></div>
        <div>انتخاب ربات: <span id="bot-choice">-</span></div>
        <div id="status">یک گزینه را انتخاب کنید!</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.expand();
            const userInfo = document.getElementById('user-info');
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userInfo.innerText = "بازیکن: " + tg.initDataUnsafe.user.first_name;
            }
        }

        function play(userChoice) {
            document.getElementById('user-choice').innerText = userChoice;
            
            // انتخاب رندوم ربات
            const options = ["سنگ", "کاغذ", "قیچی"];
            const botChoice = options[Math.floor(Math.random() * 3)];
            document.getElementById('bot-choice').innerText = botChoice;
            
            const statusDiv = document.getElementById('status');
            
            // بررسی برنده و بازنده
            if (userChoice === botChoice) {
                statusDiv.innerText = "بازی مساوی شد! 🤝";
                statusDiv.style.color = "#8e8e93";
            } else if (
                (userChoice === "سنگ" && botChoice === "قیچی") ||
                (userChoice === "کاغذ" && botChoice === "سنگ") ||
                (userChoice === "قیچی" && botChoice === "کاغذ")
            ) {
                statusDiv.innerText = "شما برنده شدید! 🎉";
                statusDiv.style.color = "#4bcd5d";
            } else {
                statusDiv.innerText = "ربات برنده شد! 🤖";
                statusDiv.style.color = "#ff3366";
            }
        }
    </script>
</body>
</html>
