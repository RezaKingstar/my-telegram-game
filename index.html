<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stack Game</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1e1e2f; font-family: sans-serif; user-select: none; }
        #score { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 48px; color: #fff; font-weight: bold; z-index: 10; }
        #tg-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 12px 24px; font-size: 18px; background: #0088cc; color: white; border: none; border-radius: 8px; cursor: pointer; display: none; z-index: 10; }
    </style>
    <!-- لود خودکار اسکریپت تلگرام و کتابخانه گرافیکی Three.js -->
    <script src="https://telegram.org"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <div id="score">0</div>
    <button id="tg-btn" onclick="sendScoreToTelegram()">ثبت امتیاز و دریافت جایزه 💰</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let scene, camera, renderer;
        let score = 0;
        let gameActive = true;
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e1e2f);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            const aspect = window.innerWidth / window.innerHeight;
            const d = 5;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(8, 8, 8);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            createBlock(0, 0, 3, 3, 0x0088cc);

            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('pointerdown', handleAction);
            
            animate();
        }

        function createBlock(x, z, w, l, color) {
            const geometry = new THREE.BoxGeometry(w, 1, l);
            const material = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, score, z);
            scene.add(mesh);
        }

        function handleAction() {
            if (!gameActive) return;
            score++;
            document.getElementById('score').innerText = score;
            
            const randomColor = Math.random() * 0xffffff;
            createBlock(0, 0, 3, 3, randomColor);
            camera.position.y += 1;
            
            if (score > 5 && Math.random() < 0.2) {
                gameOver();
            }
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('score').innerText = "امتیاز نهایی: " + score;
            document.getElementById('tg-btn').style.display = "block";
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const d = 5;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        function sendScoreToTelegram() {
            tg.sendData(JSON.stringify({ score: score }));
            tg.close();
        }

        init();
    </script>
</body>
</html>
