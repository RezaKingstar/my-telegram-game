<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>تپ کلیکر تلگرام</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; background: #1a1a1a; margin: 0; padding: 20px; direction: rtl; color: white; overflow: hidden; }
        h1 { color: #fff; font-size: 20px; margin-top: 10px; }
        #user-info { margin-bottom: 20px; color: #0088cc; font-weight: bold; }
        .score-container { font-size: 36px; font-weight: bold; margin: 20px 0; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .coin-wrapper { display: flex; justify-content: center; margin-top: 40px; }
        .coin { width: 160px; height: 160px; background: linear-gradient(135deg, #ffd700, #ffa500); border-radius: 50%; border: 8px solid #cc8400; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 60px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); user-select: none; transition: transform 0.05s ease; }
        .coin:active { transform: scale(0.92); box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .upgrade-section { margin-top: 50px; background: #2a2a2a; padding: 15px; border-radius: 12px; display: inline-block; min-width: 260px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .upgrade-btn { background: #4bcd5d; color: white; border: none; padding: 10px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; font-family: Tahoma; width: 100%; transition: 0.2s; }
        .upgrade-btn:disabled { background: #555; color: #aaa; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>بازی سکه تلگرام 🪙</h1>
    <div id="user-info">بازیکن: مهمان</div>
    
    <div class="score-container" id="score">0</div>

    <div class="coin-wrapper">
        <div class="coin" id="coinBtn" onclick="clickCoin()">🪙</div>
    </div>

    <div class="upgrade-section">
        <div style="margin-bottom: 10px; font-size: 14px; color: #ccc;">قدرت هر کلیک: <span id="clickPower">۱</span></div>
        <button class="upgrade-btn" id="upgradeBtn" onclick="buyUpgrade()" disabled>ارتقا کلیک (هزینه: ۵۰ سکه)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.expand();
            const userInfo = document.getElementById('user-info');
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userInfo.innerText = "بازیکن: " + tg.initDataUnsafe.user.first_name;
            }
        }

        let coins = 0;
        let power = 1;
        let upgradeCost = 50;

        function updateUI() {
            document.getElementById('score').innerText = coins;
            document.getElementById('clickPower').innerText = power;
            document.getElementById('upgradeBtn').innerText = "ارتقا کلیک (هزینه: " + upgradeCost + " سکه)";
            
            if (coins >= upgradeCost) {
                document.getElementById('upgradeBtn').disabled = false;
            } else {
                document.getElementById('upgradeBtn').disabled = true;
            }
        }

        function clickCoin() {
            coins = coins + power;
            updateUI();
            
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        function buyUpgrade() {
            if (coins >= upgradeCost) {
                coins = coins - upgradeCost;
                power = power + 1;
                upgradeCost = Math.round(upgradeCost * 2.2);
                updateUI();
            }
        }
        
        updateUI();
    </script>
</body>
</html>
