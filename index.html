<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی دوز تلگرام</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; direction: rtl; }
        h1 { color: #333; font-size: 20px; }
        #user-info { margin-bottom: 15px; color: #0088cc; font-weight: bold; }
        .board { display: grid; grid-template-columns: repeat(3, 80px); gap: 10px; justify-content: center; margin-top: 20px; }
        .cell { width: 80px; height: 80px; background: white; border: 2px solid #0088cc; font-size: 32px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; user-select: none; }
        .cell.taken { cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 18px; font-weight: bold; color: #ff3366; }
        .controls { margin-top: 25px; display: flex; gap: 10px; justify-content: center; }
        button { padding: 12px 20px; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; font-family: Tahoma; font-weight: bold; transition: 0.2s; }
        .btn-reset { background: #0088cc; color: white; }
        .btn-reset:hover { background: #006699; }
        .btn-sound { background: #4bcd5d; color: white; }
        .btn-sound.off { background: #8e8e93; }
    </style>
</head>
<body>

    <h1>خوش آمدی به بازی دوز!</h1>
    <div id="user-info">بازیکن: مهمان</div>
    
    <div class="board" id="board">
        <div class="cell" onclick="makeMove(this, 0)"></div>
        <div class="cell" onclick="makeMove(this, 1)"></div>
        <div class="cell" onclick="makeMove(this, 2)"></div>
        <div class="cell" onclick="makeMove(this, 3)"></div>
        <div class="cell" onclick="makeMove(this, 4)"></div>
        <div class="cell" onclick="makeMove(this, 5)"></div>
        <div class="cell" onclick="makeMove(this, 6)"></div>
        <div class="cell" onclick="makeMove(this, 7)"></div>
        <div class="cell" onclick="makeMove(this, 8)"></div>
    </div>

    <div id="status">نوبت شماست (X)</div>

    <!-- بخش دکمه‌های کنترل بازی -->
    <div class="controls">
        <button class="btn-reset" onclick="resetGame()">🔄 شروع مجدد</button>
        <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊 صدا: روشن</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.expand();
            const userInfo = document.getElementById('user-info');
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userInfo.innerText = "بازیکن: " + tg.initDataUnsafe.user.first_name;
            }
        }

        let board = ["", "", "", "", "", "", "", "", ""];
        let gameOver = false;
        let isSoundOn = true;

        // ساخت صداهای فرضی به کمک مروگر بدون نیاز به فایل صوتی خارجی
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            if (!isSoundOn) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        function toggleSound() {
            isSoundOn = !isSoundOn;
            const soundBtn = document.getElementById('soundBtn');
            if (isSoundOn) {
                soundBtn.innerText = "🔊 صدا: روشن";
                soundBtn.classList.remove('off');
            } else {
                soundBtn.innerText = "🔇 صدا: خاموش";
                soundBtn.classList.add('off');
            }
        }

        function makeMove(cell, index) {
            if (board[index] !== "" || gameOver) return;

            playTone(523.25, "sine", 0.1); // صدای کلیک بازیکن (نت دو)
            board[index] = "X";
            cell.innerText = "X";
            cell.style.color = "#0088cc";
            cell.classList.add('taken');

            if (checkWin("X")) {
                document.getElementById('status').innerText = "شما برنده شدید! 🎉";
                playTone(587.33, "triangle", 0.4); // صدای برنده شدن
                gameOver = true;
                return;
            }

            if (!board.includes("")) {
                document.getElementById('status').innerText = "بازی مساوی شد! 🤝";
                gameOver = true;
                return;
            }

            document.getElementById('status').innerText = "نوبت ربات...";
            setTimeout(botMove, 500);
        }

        function botMove() {
            if (gameOver) return;
            
            let emptyCells = [];
            board.forEach((val, idx) => { if (val === "") emptyCells.push(idx); });

            if (emptyCells.length === 0) return;

            let randomIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            board[randomIndex] = "O";
            
            const cellElements = document.getElementsByClassName('cell');
            cellElements[randomIndex].innerText = "O";
            cellElements[randomIndex].style.color = "#ff3366";
            cellElements[randomIndex].classList.add('taken');
            playTone(392.00, "sine", 0.1); // صدای حرکت ربات (نت سل)

            if (checkWin("O")) {
                document.getElementById('status').innerText = "ربات برنده شد! 🤖";
                playTone(220.00, "sawtooth", 0.5); // صدای باختن
                gameOver = true;
                return;
            }

            document.getElementById('status').innerText = "نوبت شماست (X)";
        }

        function checkWin(player) {
            const winPatterns = [, [3, 4, 5], [6, 7, 8], // افقی, [1, 4, 7], [2, 5, 8], // عمودی, [2, 4, 6]             // قطری
            ];
            return winPatterns.some(pattern => {
                return pattern.every(idx => board[idx] === player);
            });
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            gameOver = false;
            document.getElementById('status').innerText = "نوبت شماست (X)";
            const cellElements = document.getElementsByClassName('cell');
            for (let cell of cellElements) {
                cell.innerText = "";
                cell.classList.remove('taken');
            }
            playTone(440.00, "sine", 0.15); // صدای ریستارت بازی
        }
    </script>
</body>
</html>
